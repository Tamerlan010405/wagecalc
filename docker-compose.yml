services:
  postgres:
    image: postgres:16-alpine
    container_name: wagecalc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagecalc}
      POSTGRES_USER: ${POSTGRES_USER:-wagecalc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagecalc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wagecalc} -d ${POSTGRES_DB:-wagecalc}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: wagecalc-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - ${DATABASE_URL:-postgres://wagecalc:wagecalc@postgres:5432/wagecalc?sslmode=disable}
      - up
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wagecalc-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://wagecalc:wagecalc@postgres:5432/wagecalc?sslmode=disable}
      DB_ENCRYPTION_KEY: "${DB_ENCRYPTION_KEY:-local-db-encryption-key-change-me-32-bytes}"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4173,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:4173,http://127.0.0.1:5173}
      PASSWORD_RESET_SECRET: "${PASSWORD_RESET_SECRET:-local-password-reset-secret-change-me}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Wagecalc <no-reply@wagecalc.local>}"
      SMTP_SECURITY: "${SMTP_SECURITY:-none}"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wagecalc-frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: wagecalc-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
